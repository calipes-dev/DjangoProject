<!-- CREATE NEW PROBLEM MODAL --> 
<!--add_problem_modal.html-->
<div class="modal fade" id="addProblemModal" tabindex="-1" aria-labelledby="addProblemModalLabel" aria-hidden="true"> 
  <div class="modal-dialog modal-lg modal-dialog-centered"> 
    <div class="modal-content text-white" style="background-color: #1E2835; border-radius: 15px;"> 
      <form method="POST" action="{% url 'add_problem' class.class_id %}" id="addProblemForm"> 
        {% csrf_token %} 
        
        <!-- HEADER --> 
        <div class="modal-header border-0 pb-0 px-4 py-4 d-flex justify-content-between align-items-start"> 
          <div> 
            <h4 class="fw-bold text-white mb-1">Create New Problem</h4> 
            <p class="text-muted small mb-0">Design and publish problems for your class with all the necessary details.</p> 
          </div> 
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" style="position: absolute; top: 15px; right: 15px;"></button> 
        </div> 
        
        <!-- BODY --> 
        <div class="modal-body px-4 pb-4"> 
          
          <!-- ROW 1: Problem Details Card -->
          <div class="mb-3">
            <div class="problem-details-section p-3 rounded-3" style="background-color: #0f172a; border: 1px solid #334155;">
              <h6 class="fw-semibold text-white mb-3 d-flex align-items-center">
                <i class="fas fa-info-circle me-2" style="color: #10b981;"></i>
                Problem Details
              </h6>
              
              <div class="row g-3">
                <div class="col-12">
                  <label class="small text-white-50 mb-2">Problem Title</label> 
                  <input type="text" name="problem_title" class="form-control text-white" style="background-color: #1e293b; border: 1px solid #334155; height: 44px;" placeholder="Enter problem title" required> 
                </div>

                <div class="col-md-3 col-6">
                  <label class="small text-white-50 mb-2">Time Limit (min)</label> 
                  <input type="number" name="time_limit" min="1" class="form-control text-white" placeholder="60" style="background-color: #1e293b; border: 1px solid #334155; height: 44px;" required> 
                </div>
                
                <div class="col-md-3 col-6">
                  <label class="small text-white-50 mb-2">Total Score</label> 
                  <input type="number" name="total_score" min="1" class="form-control text-white" placeholder="100" style="background-color: #1e293b; border: 1px solid #334155; height: 44px;" required> 
                </div>

                <div class="col-md-3 col-6">
                  <label class="small text-white-50 mb-2">Problem Type</label> 
                  <select name="problem_type" class="form-select text-white" style="background-color: #1e293b; border: 1px solid #334155; height: 44px;" required> 
                    <option value="">Select Type</option> 
                    <option value="Assignment">Assignment</option> 
                    <option value="Quiz">Quiz</option> 
                  </select> 
                </div>

                <div class="col-md-3 col-6">
                  <label class="small text-white-50 mb-2">Due Date</label> 
                  <input type="datetime-local" name="due_date" class="form-control text-white" style="background-color: #1e293b; border: 1px solid #334155; height: 44px;" required> 
                </div>
              </div>
            </div>
          </div>

          <!-- ROW 2: Test Cases Card -->
          <div class="mb-3">
            <div class="test-cases-section p-3 rounded-3" style="background-color: #0f172a; border: 1px solid #334155;">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-semibold text-white mb-0 d-flex align-items-center">
                  <i class="fas fa-vial me-2" style="color: #10b981;"></i>
                  Test Cases
                </h6>
                <span class="badge px-3 py-1" style="background-color: #10b981; font-size: 0.8rem;" id="testCaseCounter">Test 1 of 3</span>
              </div>
              
              <!-- Test Case Container -->
              <div id="testCaseContainer" class="test-case-wrapper">
                <!-- Test Case 1 -->
                <div class="test-case-group" data-testcase="1">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="small fw-semibold mb-2" style="color: #94a3b8;">Input</label>
                      <textarea name="input1" rows="4" class="form-control text-white" placeholder="Enter input for test case 1..." style="background-color: #1e293b; border: 1px solid #334155; resize: none; font-family: 'Courier New', monospace;"></textarea>
                    </div>
                    <div class="col-md-6">
                      <label class="small fw-semibold mb-2" style="color: #94a3b8;">Expected Output</label>
                      <textarea name="output1" rows="4" class="form-control text-white" placeholder="Enter expected output for test case 1..." style="background-color: #1e293b; border: 1px solid #334155; resize: none; font-family: 'Courier New', monospace;"></textarea>
                    </div>
                  </div>
                </div>

                <!-- Test Case 2 -->
                <div class="test-case-group" data-testcase="2" style="display: none;">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="small fw-semibold mb-2" style="color: #94a3b8;">Input</label>
                      <textarea name="input2" rows="4" class="form-control text-white" placeholder="Enter input for test case 2..." style="background-color: #1e293b; border: 1px solid #334155; resize: none; font-family: 'Courier New', monospace;"></textarea>
                    </div>
                    <div class="col-md-6">
                      <label class="small fw-semibold mb-2" style="color: #94a3b8;">Expected Output</label>
                      <textarea name="output2" rows="4" class="form-control text-white" placeholder="Enter expected output for test case 2..." style="background-color: #1e293b; border: 1px solid #334155; resize: none; font-family: 'Courier New', monospace;"></textarea>
                    </div>
                  </div>
                </div>

                <!-- Test Case 3 -->
                <div class="test-case-group" data-testcase="3" style="display: none;">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="small fw-semibold mb-2" style="color: #94a3b8;">Input</label>
                      <textarea name="input3" rows="4" class="form-control text-white" placeholder="Enter input for test case 3..." style="background-color: #1e293b; border: 1px solid #334155; resize: none; font-family: 'Courier New', monospace;"></textarea>
                    </div>
                    <div class="col-md-6">
                      <label class="small fw-semibold mb-2" style="color: #94a3b8;">Expected Output</label>
                      <textarea name="output3" rows="4" class="form-control text-white" placeholder="Enter expected output for test case 3..." style="background-color: #1e293b; border: 1px solid #334155; resize: none; font-family: 'Courier New', monospace;"></textarea>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Navigation Buttons -->
              <div class="mt-3 d-flex gap-2">
                <button type="button" class="btn btn-outline-light" id="prevTestCase" style="display: none; height: 40px; flex: 1;">
                  <i class="fas fa-arrow-left me-2"></i>Previous
                </button>
                <button type="button" class="btn btn-success fw-semibold" id="nextTestCase" style="height: 40px; flex: 2;">
                  Add Test Case 2<i class="fas fa-arrow-right ms-2"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- ROW 3: Instructions Card -->
          <div class="mb-3">
            <div class="instruction-section p-3 rounded-3" style="background-color: #0f172a; border: 1px solid #334155;">
              <h6 class="fw-semibold text-white mb-3 d-flex align-items-center">
                <i class="fas fa-file-alt me-2" style="color: #10b981;"></i>
                Instructions
              </h6>
              <textarea name="problem_description" rows="4" class="form-control text-white" placeholder="Provide detailed instructions for the problem..." style="background-color: #1e293b; border: 1px solid #334155; resize: vertical; min-height: 100px;" required></textarea> 
            </div>
          </div>

        </div> 
        
        <!-- FOOTER --> 
        <div class="modal-footer border-0 px-4 py-3" style="background-color: #0f172a; border-radius: 0 0 15px 15px;"> 
          <button type="button" class="btn btn-outline-light px-4 fw-semibold" data-bs-dismiss="modal" style="height: 44px;">
            Cancel
          </button> 
          <button type="submit" class="btn btn-success fw-bold px-5" style="height: 44px; background-color: #10b981;">
            <i class="fas fa-check me-2"></i>Create Problem
          </button> 
        </div> 
      </form> 
    </div> 
  </div> 
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  let currentTestCase = 1;
  const maxTestCases = 3;
  
  const nextBtn = document.getElementById('nextTestCase');
  const prevBtn = document.getElementById('prevTestCase');
  const counter = document.getElementById('testCaseCounter');
  const testCaseGroups = document.querySelectorAll('.test-case-group');

  // Reset when modal is closed
  document.getElementById('addProblemModal').addEventListener('hidden.bs.modal', function() {
    currentTestCase = 1;
    updateDisplay();
    document.getElementById('addProblemForm').reset();
  });

  function updateDisplay() {
    testCaseGroups.forEach(group => {
      group.style.display = 'none';
    });

    const currentGroup = document.querySelector(`[data-testcase="${currentTestCase}"]`);
    if (currentGroup) {
      currentGroup.style.display = 'block';
    }

    counter.textContent = `Test ${currentTestCase} of ${maxTestCases}`;

    if (currentTestCase === 1) {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'block';
      nextBtn.innerHTML = 'Add Test Case 2<i class="fas fa-arrow-right ms-2"></i>';
    } else if (currentTestCase === 2) {
      prevBtn.style.display = 'block';
      nextBtn.style.display = 'block';
      nextBtn.innerHTML = 'Add Test Case 3<i class="fas fa-arrow-right ms-2"></i>';
    } else if (currentTestCase === maxTestCases) {
      prevBtn.style.display = 'block';
      nextBtn.style.display = 'none';
    }
  }

  nextBtn.addEventListener('click', function() {
    if (currentTestCase < maxTestCases) {
      currentTestCase++;
      updateDisplay();
    }
  });

  prevBtn.addEventListener('click', function() {
    if (currentTestCase > 1) {
      currentTestCase--;
      updateDisplay();
    }
  });

  updateDisplay();
});
</script>

<style>
.problem-details-section,
.test-cases-section,
.instruction-section {
  transition: all 0.2s ease;
}

.test-case-wrapper {
  min-height: 180px;
  position: relative;
}

.test-case-group {
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

#nextTestCase, #prevTestCase {
  transition: all 0.2s ease;
  border-radius: 8px;
}

#nextTestCase:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
}

#prevTestCase:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
}

.form-control:focus,
.form-select:focus {
  border-color: #10b981 !important;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1) !important;
  background-color: #1e293b !important;
}

/* Scrollbar styling for textareas */
textarea::-webkit-scrollbar {
  width: 8px;
}

textarea::-webkit-scrollbar-track {
  background: #0f172a;
  border-radius: 4px;
}

textarea::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 4px;
}

textarea::-webkit-scrollbar-thumb:hover {
  background: #475569;
}

/* Badge styling */
#testCaseCounter {
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.8;
  }
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .modal-body {
    padding: 1.5rem !important;
  }
  
  .problem-details-section,
  .test-cases-section,
  .instruction-section {
    margin-bottom: 1rem;
  }
}
</style>
