{% load static %}


<!--header.html-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
  <link rel="apple-touch-icon" sizes="76x76" href="{% static 'img/apple-icon.png' %}">
  <link rel="icon" type="image/png" href="{% static 'img/favicon.ico' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  

  <title>PauliCode</title>

  <!-- Fonts and icons -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  rel="stylesheet"
  />




</head>

<style>
.text-muted{
  color: #85929e !important;
}
#loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #273149;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

#loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Fade-in for main content */
#main-content {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

#main-content.visible {
      opacity: 1;
    }
body.index-page {
    background-color: #1a1a1a;
  }
body.other-page {
      background-color: #111827;
    }
  

    /* small, page-scoped spinner animation so it always works */
.loading-spinner-ring {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.12);     /* faint ring */
  border-top-color: #ffffff;                     /* white segment to show rotation */
  box-sizing: border-box;
  animation: loading-spin 0.85s linear infinite;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

@keyframes loading-spin {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* make sure icon sits above the ring */
.loading-icon {
  width: 100px;
  height: 100px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
}


  /* 🌿 Green family */
  .border-green {
    background-color: #1f2937;
    color: #00ff9d;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    border: 1px dashed #00ff9d;
    border-width: 1px !important;
    letter-spacing: 0.5px;
    box-shadow: 0 0 8px rgba(0, 255, 157, 0.3);
    transition: all 0.3s ease;
  }

  /* 💙 Blue family */
  .border-dark {
    background-color: #1f2937;
    color: rgb(137, 216, 255);
    font-family: 'Courier New', monospace;
    font-size: 15px;
    border: 1px dashed rgb(180, 230, 255);
    border-width: 1px !important;
    letter-spacing: 0.5px;
    box-shadow: 0 0 8px rgba(13, 110, 253, 0.3);
    transition: all 0.3s ease;
  }

  .border-green:hover,
  .border-dark:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 15px currentColor;
  }
  body {
    background-color: #111827 !important;
  }

</style>
