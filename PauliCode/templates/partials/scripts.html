<!-- SEARCH & FILTER JS -->
 <script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    const searchInput = form.querySelector('input[name="q"]');
    const filterButtons = document.querySelectorAll('button[name="filter"]');

    filterButtons.forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();

        const selectedFilter = btn.value;
        const searchValue = searchInput.value.trim();

        const url = new URL(window.location.href);

        // If user clicks the same filter again, remove it (toggle off)
        if (url.searchParams.get('filter') === selectedFilter) {
          url.searchParams.delete('filter');
        } else {
          url.searchParams.set('filter', selectedFilter);
        }

        // Keep the search query if it exists
        if (searchValue) {
          url.searchParams.set('q', searchValue);
        } else {
          url.searchParams.delete('q');
        }

        window.location.href = url.toString();
      });
    });

    // Clear search query dynamically when the input is cleared
    searchInput.addEventListener('input', () => {
      if (searchInput.value.trim() === '') {
        const url = new URL(window.location.href);
        url.searchParams.delete('q');
        window.location.href = url.toString();
      }
    });
  });
</script>


 <script>
document.querySelectorAll('.problem-card').forEach(card => {
  card.addEventListener('click', function() {
    const problemId = this.dataset.problemId;
    if (!problemId) return;

    fetch(`/problem/${problemId}/details/`)
      .then(res => res.json())
      .then(data => {
        // Fill in modal data
        document.getElementById('problem_title').textContent = data.title;
        document.getElementById('problem_description').textContent = data.description;
        document.getElementById('problem_type').textContent = data.type;
        document.getElementById('total_score').textContent = data.score;
        document.getElementById('time_limit').textContent = data.time_limit;
        document.getElementById('due_date').textContent = "Due: " + data.due_date;

                // Populate test cases
        const container = document.getElementById('test_cases_container');
        container.innerHTML = '';

       data.test_cases.forEach((tc, index) => {
            const col = document.createElement('div');
            col.className = 'col-12';

            const total = data.test_cases.length;
            const testCaseNumber = index + 1;
            let hideIndex = total; // Hide the last test case, depending on total count

            if (testCaseNumber === hideIndex) {
              // Hide this test case
              col.innerHTML = `
                <div class="p-3 mb-3 rounded text-center" style="background:#1e2b4d; border:1px dashed #3b4b6b;">
                  <span class="badge bg-secondary px-3 py-2">Test Case ${testCaseNumber} Hidden</span>
                </div>
              `;
            } else {
              // Show normal test case
              col.innerHTML = `
                <div class="p-2 mb-2 rounded" style="background:#121f3d; border:1px solid #2b3a55;">
                  <strong>Input ${testCaseNumber}:</strong>
                  <pre style="margin:0; white-space:pre-wrap;">${tc.input}</pre>
                </div>
                <div class="p-2 mb-3 rounded" style="background:#121f3d; border:1px solid #2b3a55;">
                  <strong>Output ${testCaseNumber}:</strong>
                  <pre style="margin:0; white-space:pre-wrap;">${tc.output}</pre>
                </div>
              `;
            }

            container.appendChild(col);
          });



        // Get reference to Answer button
        const answerBtn = document.getElementById('answerButton');

        // ✅ Disable button if problem already answered
        if (data.answered === true) {
          answerBtn.disabled = true;
          answerBtn.textContent = "Answered";
          answerBtn.classList.remove("btn-success");
          answerBtn.classList.add("btn-secondary");
        } else {
          answerBtn.disabled = false;
          answerBtn.textContent = "Answer";
          answerBtn.classList.add("btn-success");
          answerBtn.classList.remove("btn-secondary");
        }

        // Set Answer button link dynamically
        answerBtn.onclick = () => {
          if (!data.answered) {
            window.location.href = `/playground/${problemId}/`;
          }
        };

        // Show modal
        const modal = new bootstrap.Modal(document.getElementById('problemDetailsModal'));
        modal.show();
      })
      .catch(err => console.error('Error fetching problem details:', err));
  });
});
</script>

<script>
// ==================== ACE EDITOR SETUP ====================
let editor = ace.edit("codeEditor");
editor.setTheme("ace/theme/dracula");
editor.session.setMode("ace/mode/python");
editor.setOptions({
  enableBasicAutocompletion: true,
  enableLiveAutocompletion: true,
  fontSize: "14px",
  showPrintMargin: false,
  highlightActiveLine: true,
  tabSize: 4,
  useSoftTabs: true
});

const languageModes = {
  python: "ace/mode/python",
  c: "ace/mode/c_cpp",
  cpp: "ace/mode/c_cpp",
  java: "ace/mode/java"
};

// Language change handler with templates
document.getElementById("language").addEventListener("change", e => {
  editor.session.setMode(languageModes[e.target.value]);
  
  const templates = {
    python: '# Write your Python code below\ndef main():\n    # Your code here\n    pass\n\nif __name__ == "__main__":\n    main()',
    c: '#include <stdio.h>\n\nint main() {\n    // Your code here\n\n    return 0;\n}',
    cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    // Your code here\n\n    return 0;\n}',
    java: '\npublic class Main {\n    public static void main(String[] args) {\n        // Your code here\n\n    }\n}'
  };
  
  editor.setValue(templates[e.target.value] || '', -1);
});

function getCode() { return editor.getValue(); }

// ==================== CONSOLE STATE ====================
let consoleState = {
  code: '',
  language: '',
  inputs: [],
  allInputs: '',
  isWaitingForInput: false,
  isFinished: false,
  needsInput: false,
  isBatchInput: false
};

// ==================== LANGUAGE HANDLERS ====================
const PythonHandler = {
  needsInput(code) {
    return /input\s*\(/.test(code);
  },
  
  isBatchMode() {
    return false;
  },
  
  getFirstPrompt(code) {
    const match = code.match(/input\s*\(\s*["'`f]([^"'`]*)["'`]/);
    return match ? match[1].replace(/\{[^}]+\}/g, '').trim() : 'Enter value:';
  },
  
  extractNextPrompt(output) {
    const lines = output.split('\n');
    for (let i = lines.length - 1; i >= 0; i--) {
      const line = lines[i].trim();
      if (line && (line.endsWith(':') || /enter|input/i.test(line))) {
        return line;
      }
    }
    return 'Enter value:';
  },
  
  needsMoreInput(stderr) {
    return stderr.includes('EOFError') || stderr.includes('EOF when reading');
  },
  
  cleanOutput(output) {
    const lines = output.split('\n');
    const result = [];
    
    for (let line of lines) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      if (trimmed.endsWith(':') && /enter|input/i.test(trimmed)) {
        continue;
      }
      result.push(line);
    }
    
    return result.join('\n').trim();
  }
};

const CHandler = {
  needsInput(code) {
    return /scanf\s*\(/.test(code);
  },
  
  isBatchMode() {
    return true;
  },
  
  countInputs(code) {
    const scanfMatches = code.match(/scanf/g);
    return scanfMatches ? scanfMatches.length : 0;
  },
  
  getInputPrompt(code) {
    return `Enter all value(s) needed in your code (space-separated or one per line):`;
  },
  
  extractPrompts(code) {
    const prompts = [];
    const lines = code.split('\n');
    
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].includes('scanf')) {
        for (let j = i - 1; j >= Math.max(0, i - 5); j--) {
          const match = lines[j].match(/printf\s*\(\s*["']([^"']*)["']/);
          if (match) {
            let prompt = match[1].replace(/\\n/g, '').replace(/%d|%s|%f|%c/g, '').trim();
            if (prompt) prompts.push(prompt);
            break;
          }
        }
      }
    }
    
    return prompts.length > 0 ? prompts : [];
  },
  
  cleanOutput(output) {
    let cleaned = output;
    cleaned = cleaned.replace(/Enter [^:\n]*:\s*/gi, '');
    cleaned = cleaned.replace(/Input [^:\n]*:\s*/gi, '');
    
    const lines = cleaned.split('\n');
    const result = [];
    
    for (let line of lines) {
      const trimmed = line.trim();
      if (trimmed && !trimmed.match(/^(Enter|Input|enter|input)/i)) {
        result.push(trimmed);
      }
    }
    
    return result.join('\n');
  }
};

const CppHandler = {
  needsInput(code) {
    return /cin\s*>>/.test(code);
  },
  
  isBatchMode() {
    return true;
  },
  
  countInputs(code) {
    const cinMatches = code.match(/cin\s*>>/g);
    return cinMatches ? cinMatches.length : 0;
  },
  
  getInputPrompt(code) {
    const count = this.countInputs(code);
    return `Enter all ${count} value(s) (space-separated or one per line):`;
  },
  
  extractPrompts(code) {
    const prompts = [];
    const lines = code.split('\n');
    
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].includes('cin >>')) {
        for (let j = i - 1; j >= Math.max(0, i - 5); j--) {
          const match = lines[j].match(/cout\s*<<\s*["']([^"']*)["']/);
          if (match) {
            let prompt = match[1].trim();
            if (prompt) prompts.push(prompt);
            break;
          }
        }
      }
    }
    
    return prompts.length > 0 ? prompts : [];
  },
  
  cleanOutput(output) {
    let cleaned = output;
    cleaned = cleaned.replace(/Enter [^:\n]*:\s*/gi, '');
    cleaned = cleaned.replace(/Input [^:\n]*:\s*/gi, '');
    
    const lines = cleaned.split('\n');
    const result = [];
    
    for (let line of lines) {
      const trimmed = line.trim();
      if (trimmed && !trimmed.match(/^(Enter|Input|enter|input)/i)) {
        result.push(trimmed);
      }
    }
    
    return result.join('\n');
  }
};

const JavaHandler = {
  needsInput(code) {
    return /Scanner/.test(code) && /\.next(Int|Line|Double|Float|Boolean|Long)\s*\(/.test(code);
  },
  
  isBatchMode() {
    return false;
  },
  
  getFirstPrompt(code) {
    const match = code.match(/System\.out\.print\w*\s*\(\s*["']([^"']*)["']/);
    return match ? match[1].trim() : 'Enter value:';
  },
  
  extractNextPrompt(output) {
    const lines = output.split('\n');
    for (let i = lines.length - 1; i >= 0; i--) {
      const line = lines[i].trim();
      if (line && (line.endsWith(':') || /enter|input/i.test(line))) {
        return line;
      }
    }
    return 'Enter value:';
  },
  
  needsMoreInput(stderr) {
    return stderr.includes('NoSuchElementException') || 
           stderr.includes('java.util.NoSuchElementException');
  },
  
  cleanOutput(output) {
    const lines = output.split('\n');
    const result = [];
    
    for (let line of lines) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      if (trimmed.endsWith(':') && trimmed.length < 100) {
        continue;
      }
      if (/^(Enter|Input|enter|input)\s/i.test(trimmed) && trimmed.endsWith(':')) {
        continue;
      }
      result.push(line);
    }
    
    return result.join('\n').trim();
  }
};

function getLanguageHandler() {
  switch(consoleState.language) {
    case 'python': return PythonHandler;
    case 'c': return CHandler;
    case 'cpp': return CppHandler;
    case 'java': return JavaHandler;
    default: return PythonHandler;
  }
}

// ==================== CONSOLE UI FUNCTIONS ====================
function appendToConsole(text, inline = false, className = '') {
  const consoleOutput = document.getElementById('consoleOutput');
  
  if (inline) {
    const span = document.createElement('span');
    span.className = className || 'prompt-line';
    span.textContent = text;
    consoleOutput.appendChild(span);
  } else {
    const textNode = document.createTextNode(text);
    consoleOutput.appendChild(textNode);
  }
  
  consoleOutput.scrollTop = consoleOutput.scrollHeight;
}

function clearConsole() {
  document.getElementById('consoleOutput').innerHTML = '';
}

function updateHelpText(text) {
  document.getElementById('inputHelp').textContent = text;
}

// ==================== INPUT HANDLING ====================
document.getElementById('consoleInput').addEventListener('keydown', function(e) {
  if (!consoleState.isFinished && consoleState.isWaitingForInput) {
    if (consoleState.isBatchInput) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitInput();
      }
    } else {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitInput();
      }
    }
  }
});

function submitInput() {
  if (consoleState.isFinished || !consoleState.isWaitingForInput) {
    return;
  }
  
  const input = document.getElementById('consoleInput');
  const handler = getLanguageHandler();
  
  if (consoleState.isBatchInput) {
    const inputText = input.value.trim();
    let values = [];
    
    if (inputText.includes('\n')) {
      values = inputText.split('\n').map(v => v.trim()).filter(v => v);
    } else {
      values = inputText.split(/\s+/).filter(v => v);
    }
    
    const prompts = handler.extractPrompts(consoleState.code);
    
    appendToConsole('\n');
    for (let i = 0; i < values.length && i < prompts.length; i++) {
      appendToConsole(prompts[i] + ' ', true, 'prompt-line');
      appendToConsole(values[i] + '\n', true, 'input-value');
    }
    
    for (let i = prompts.length; i < values.length; i++) {
      appendToConsole(values[i] + '\n', true, 'input-value');
    }
    
    appendToConsole('\n');
    
    consoleState.allInputs = values.join('\n');
    consoleState.inputs = values;
    
  } else {
    const value = input.value;
    appendToConsole(value + '\n', true, 'input-value');
    consoleState.inputs.push(value);
    consoleState.allInputs = consoleState.inputs.join('\n');
  }
  
  input.value = '';
  input.disabled = true;
  document.getElementById('submitInputIcon').style.display = 'none';
  consoleState.isWaitingForInput = false;
  updateHelpText('Processing...');
  
  setTimeout(() => {
    executeCode();
  }, 100);
}

// ==================== CODE EXECUTION ====================
async function executeCode() {
  try {
    const response = await fetch("{% url 'run_test_code' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify({
        code: consoleState.code,
        language: consoleState.language,
        stdin: consoleState.allInputs
      })
    });
    
    const data = await response.json();
    const handler = getLanguageHandler();
    
    if (data.success) {
      const output = data.output || '';
      const stderr = data.stderr || '';
      const compileError = data.compile_error || '';
      
      if (compileError) {
        appendToConsole('\n--- Compile Error ---\n');
        appendToConsole(compileError);
        finishExecution();
        return;
      }
      
      if (!handler.isBatchMode()) {
        const needsMore = handler.needsMoreInput(stderr);
        
        if (needsMore && consoleState.needsInput) {
          const prompt = handler.extractNextPrompt(output);
          appendToConsole(prompt + ' ', true);
          
          consoleState.isWaitingForInput = true;
          const input = document.getElementById('consoleInput');
          input.disabled = false;
          input.focus();
          document.getElementById('submitInputIcon').style.display = 'block';
          updateHelpText('Enter value and press Enter...');
          return;
        }
      }
      
      if (stderr && !handler.needsMoreInput(stderr)) {
        appendToConsole('\n--- Runtime Error ---\n');
        appendToConsole(stderr);
        finishExecution();
        return;
      }
      
      const cleaned = handler.cleanOutput(output);
      
      if (cleaned) {
        appendToConsole('\n' + cleaned + '\n');
      }
      
      appendToConsole('\n✓ Program completed successfully\n');
      finishExecution();
      
    } else {
      appendToConsole('\n⚠️ Error: ' + (data.error || 'Unknown error') + '\n');
      finishExecution();
    }
    
  } catch (error) {
    appendToConsole('\n⚠️ Connection error: ' + error.message + '\n');
    finishExecution();
  }
}

function finishExecution() {
  consoleState.isFinished = true;
  consoleState.isWaitingForInput = false;
  document.getElementById('consoleInput').disabled = true;
  document.getElementById('submitInputIcon').style.display = 'none';
  updateHelpText('Execution finished. Click Rerun to run again or Close to exit.');
  
  document.getElementById('rerunBtn').disabled = false;
}

function rerunCode() {
  const code = getCode();
  const language = document.getElementById('language').value;
  
  if (!code.trim()) {
    alert('⚠️ Code cannot be empty!');
    return;
  }
  
  const handler = getLanguageHandler();
  const needsInput = handler.needsInput(code);
  const isBatchInput = handler.isBatchMode();
  
  consoleState = {
    code: code,
    language: language,
    inputs: [],
    allInputs: '',
    isWaitingForInput: needsInput,
    isFinished: false,
    needsInput: needsInput,
    isBatchInput: isBatchInput
  };
  
  document.getElementById('rerunBtn').disabled = true;
  clearConsole();
  
  if (needsInput) {
    const input = document.getElementById('consoleInput');
    const submitIcon = document.getElementById('submitInputIcon');
    input.disabled = false;
    input.value = '';
    submitIcon.style.display = 'block';
    
    if (isBatchInput) {
      const prompt = handler.getInputPrompt(code);
      appendToConsole('╔════════════════════════════════════════╗\n', false, 'info');
      appendToConsole('║  C/C++ Batch Input Mode                ║\n', false, 'info');
      appendToConsole('╚════════════════════════════════════════╝\n', false, 'info');
      appendToConsole('\n' + prompt + '\n\n', true, 'prompt-line');
      
      document.getElementById('batchInputInfo').style.display = 'block';
      input.setAttribute('rows', '2');
      input.style.height = 'auto';
      input.style.minHeight = '60px';
      updateHelpText('Enter values separated by spaces or one per line, then press Enter');
    } else {
      const firstPrompt = handler.getFirstPrompt(code);
      appendToConsole(firstPrompt + ' ', true);
      updateHelpText('Enter value and press Enter...');
      
      document.getElementById('batchInputInfo').style.display = 'none';
      input.removeAttribute('rows');
      input.style.height = '';
      input.style.minHeight = '';
    }
    
    input.focus();
  } else {
    const input = document.getElementById('consoleInput');
    const submitIcon = document.getElementById('submitInputIcon');
    input.disabled = true;
    submitIcon.style.display = 'none';
    input.removeAttribute('rows');
    input.style.height = '';
    input.style.minHeight = '';
    document.getElementById('batchInputInfo').style.display = 'none';
    updateHelpText('Executing code (no input required)...');
    appendToConsole('Running program...\n');
    
    setTimeout(() => {
      executeCode();
    }, 100);
  }
}

function runCode() {
  const code = getCode();
  const language = document.getElementById('language').value;
  
  if (!code.trim()) {
    alert('⚠️ Code cannot be empty!');
    return;
  }
  
  const handler = getLanguageHandler();
  const needsInput = handler.needsInput(code);
  const isBatchInput = handler.isBatchMode();
  
  consoleState = {
    code: code,
    language: language,
    inputs: [],
    allInputs: '',
    isWaitingForInput: needsInput,
    isFinished: false,
    needsInput: needsInput,
    isBatchInput: isBatchInput
  };
  
  const modal = new bootstrap.Modal(document.getElementById('consoleModal'));
  modal.show();
  
  document.getElementById('rerunBtn').disabled = true;
  clearConsole();
  
  if (needsInput) {
    const input = document.getElementById('consoleInput');
    const submitIcon = document.getElementById('submitInputIcon');
    input.disabled = false;
    input.value = '';
    submitIcon.style.display = 'block';
    
    if (isBatchInput) {
      const prompt = handler.getInputPrompt(code);
      appendToConsole('╔════════════════════════════════════════╗\n', false, 'info');
      appendToConsole('║  C/C++ Batch Input Mode                ║\n', false, 'info');
      appendToConsole('╚════════════════════════════════════════╝\n', false, 'info');
      appendToConsole('\n' + prompt + '\n\n', true, 'prompt-line');
      
      document.getElementById('batchInputInfo').style.display = 'block';
      input.setAttribute('rows', '2');
      input.style.height = 'auto';
      input.style.minHeight = '60px';
      updateHelpText('Enter values separated by spaces or one per line, then press Enter');
    } else {

// ==================== CHECK CODE FUNCTION ====================
function getProblemTestCount() {
  const meta = document.getElementById('problemMeta');
  return parseInt(meta?.dataset?.testCount || '0', 10);
}

function animateTestUpdates(testResults) {
  const totalPoints = getProblemTestCount() * 10;
  let runningScore = 0;

  testResults.forEach((res, idx) => {
    const delay = idx * 350;
    setTimeout(() => {
      const id = `tcStatus${idx+1}`;
      const el = document.getElementById(id);
      if (!el) return;
      if (res === true) {
        el.className = 'badge bg-success';
        el.textContent = `PASSED`;
        runningScore += 10;
      } else if (res === false) {
        el.className = 'badge bg-danger';
        el.textContent = `FAILED`;
      } else {
        el.className = 'badge bg-secondary';
        el.textContent = `Hidden`;
      }
      document.getElementById('studentScoreValue').textContent = runningScore;
      document.getElementById('studentScoreTotal').textContent = totalPoints;
    }, delay);
  });
}

function parseResultSummary(resultSummary) {
  const lines = (resultSummary || '').split('\n');
  const testCount = getProblemTestCount();
  const results = new Array(testCount).fill(null);
  lines.forEach(line => {
    const m = line.match(/Test\s*(\d+):\s*(Passed|Failed|Error)/i);
    if (m) {
      const idx = parseInt(m[1], 10) - 1;
      const status = m[2].toLowerCase();
      if (status === 'passed') results[idx] = true;
      else results[idx] = false;
    }
  });
  return results;
}

  const modalOutput = document.getElementById('checkResult');
  const checkLoading = document.getElementById('checkLoading');

  try {

    const response = await fetch(url, {

      headers: {

        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify({

      })
    });

let submissionInProgress = false;

// =============================
// IMPROVED WINDOW STATE MONITORING
// =============================
(function monitorWindowState() {
  function isInFullscreen() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement ||
      document.msFullscreenElement
    );
  }
  
  function isWindowMaximized() {
    const tolerance = 50;
    const widthMaxed = window.outerWidth >= (window.screen.availWidth - tolerance);
    const heightMaxed = window.outerHeight >= (window.screen.availHeight - tolerance);
    return widthMaxed && heightMaxed;
  }
  
  function getWindowState() {
    return {
      isFullscreen: isInFullscreen(),
      isMaximized: isWindowMaximized(),
      width: window.outerWidth,
      height: window.outerHeight,
      availWidth: window.screen.availWidth,
      availHeight: window.screen.availHeight,
      documentVisible: !document.hidden,
      hasFocus: document.hasFocus()
    };
  }
  
  wasMaximized = isWindowMaximized() || isInFullscreen();
  
  setTimeout(() => {
    const state = getWindowState();
    if (!state.isMaximized && !state.isFullscreen && !hasSubmitted) {
      alert(
        "⚠️ Please MAXIMIZE your browser window or press F11 for fullscreen.\n\n" +
        "Your window must stay maximized throughout the activity."
      );
    }
  }, 1000);
  
  let resizeTimeout;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimeout);
    
    resizeTimeout = setTimeout(() => {
      if (hasSubmitted) return;
      
      const state = getWindowState();
      const currentlyMaximized = state.isMaximized || state.isFullscreen;
      
      if (wasMaximized && !currentlyMaximized) {
        console.log("Window un-maximized detected!");
        autoSubmit("Window was resized or un-maximized", false);
        alert("🚫 Window resize detected! Your code has been submitted.");
        redirectToClass();
      }
      
      wasMaximized = currentlyMaximized;
    }, 300);
  });
  
  setInterval(() => {
    if (hasSubmitted) return;
    
    const state = getWindowState();
    const currentlyMaximized = state.isMaximized || state.isFullscreen;
    
    if (wasMaximized && !currentlyMaximized) {
      console.log("Periodic check: Window no longer maximized!");
      autoSubmit("Window no longer maximized", false);
      alert("🚫 Your browser window must stay maximized! Code submitted.");
      redirectToClass();
    }
  }, 2000);
  
  console.log("Initial window state:", getWindowState());
})();

(function detectMultipleInstances() {

// =============================

// =============================
function autoSubmit(reason = "Security trigger", shouldRedirect = true) {
  if (submissionInProgress || hasSubmitted) {
    return false;
  }
  
  submissionInProgress = true;
  hasSubmitted = true;
  console.log(`Auto-submit triggered: ${reason}`);

  const problemId = "{{ problem.problem_id }}";
  const code = getCode();
  const lang = document.getElementById('language').value;

  try {
    sessionStorage.setItem(`submitted_${problemId}`, 'true');
  } catch (e) {
    // Ignore
  }

  const data = JSON.stringify({
    problem_id: problemId,
    code: code,
    language: lang,
    auto_submit: true,
    reason: reason
  });

  const url = `/submit_problem/${problemId}/`;
  const blob = new Blob([data], { type: 'application/json' });
  const sent = navigator.sendBeacon(url, blob);
  
  if (sent && shouldRedirect) {
    setTimeout(() => {
      window.location.href = "{% if problem and problem.class_id %}{% url 'student_class_details' problem.class_id.class_id %}{% else %}{% url 'StudentClass' %}{% endif %}";
    }, 500);
  }

  return sent;
}

async function submitCode() {
  if (submissionInProgress || hasSubmitted) {
    alert("Submission already in progress.");
    return;
  }

  const checkResultDiv = document.getElementById('checkResult');
  const checkLoading = document.getElementById('checkLoading');

  checkResultDiv.textContent = "";
  checkLoading.style.display = "flex";
  submissionInProgress = true;

  try {
    const code = getCode();
    const problemId = "{{ problem.problem_id }}";
    const lang = document.getElementById('language').value;

    const response = await fetch(`/submit_problem/${problemId}/`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify({
        problem_id: problemId,
        code: code,
        language: lang
      })
    });

    const data = await response.json();
    checkLoading.style.display = "none";

    if (data.success) {
      const testResults = parseResultSummary(data.result_summary);
      animateTestUpdates(testResults);

      const finalScore = data.score ?? (testResults.filter(Boolean).length * 10);
      document.getElementById('studentScoreValue').textContent = finalScore;

      checkResultDiv.innerHTML = `<pre style="color:#28a745;">${data.result_summary}</pre>`;

      hasSubmitted = true;

      setTimeout(() => {

      }, 1500);
    } else {
      submissionInProgress = false;
      checkResultDiv.textContent = "⚠️ " + (data.message || "Submission failed.");
    }
  } catch (error) {
    checkLoading.style.display = "none";
    submissionInProgress = false;
    checkResultDiv.textContent = "⚠️ Submission failed: " + error.message;
    console.error(error);
  }
}

// TIMER WITH PERSISTENCE
// =============================
(function startCountdown() {
  const timerMeta = document.getElementById('problemTimer');
  if (!timerMeta) return;

  const timeLimitMinutes = parseInt(timerMeta.dataset.timelimit || '0', 10);
  if (isNaN(timeLimitMinutes) || timeLimitMinutes <= 0) return;

  const timerDisplay = document.getElementById('timerDisplay');
  const problemId = "{{ problem.problem_id }}";
  const timerKey = `timer_${problemId}`;
  
  let deadline;
  const savedDeadline = sessionStorage.getItem(timerKey);
  
  if (savedDeadline) {
    deadline = new Date(parseInt(savedDeadline, 10));
    console.log("Restored timer deadline:", deadline);
  } else {
    deadline = new Date(Date.now() + timeLimitMinutes * 60 * 1000);
    sessionStorage.setItem(timerKey, deadline.getTime().toString());
    console.log("Created new timer deadline:", deadline);
  }

  const tick = setInterval(() => {
    const now = new Date();
    const remaining = Math.floor((deadline - now) / 1000);

    if (remaining <= 0) {
      clearInterval(tick);
      timerDisplay.textContent = "⏱️ Time's up!";
      timerDisplay.classList.remove('text-warning');
      timerDisplay.classList.add('text-danger');
      
      sessionStorage.removeItem(timerKey);
      
      autoSubmit("Time limit exceeded");
      alert("Time is up! Your code has been submitted automatically.");
      
      setTimeout(() => {
        window.location.href = "{% if problem and problem.class_id %}{% url 'student_class_details' problem.class_id.class_id %}{% else %}{% url 'StudentClass' %}{% endif %}";
      }, 1000);
      return;
    }

    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }, 1000);
})();

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    const cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + "=")) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
