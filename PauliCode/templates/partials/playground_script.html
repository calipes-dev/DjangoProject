<!-- Ace Editor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/mode-python.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/mode-c_cpp.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/mode-java.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/theme-dracula.js"></script>
<!--Script for Playground.html-->
<script>
// Initialize ACE Editor
let editor = ace.edit("codeEditor");
editor.setTheme("ace/theme/dracula");
editor.session.setMode("ace/mode/python");
editor.setOptions({
  enableBasicAutocompletion: true,
  enableLiveAutocompletion: true,
  fontSize: "14px",
  showPrintMargin: false,
  highlightActiveLine: true,
  tabSize: 4,
  useSoftTabs: true
});

// Language modes mapping
const languageModes = {
  python: "ace/mode/python",
  c: "ace/mode/c_cpp",
  cpp: "ace/mode/c_cpp",
  java: "ace/mode/java"
};

// Language change handler
document.getElementById("language").addEventListener("change", e => {
  editor.session.setMode(languageModes[e.target.value]);
  
  const templates = {
    python: '# Write your Python code below\ndef main():\n    # Your code here\n    pass\n\nif __name__ == "__main__":\n    main()',
    c: '#include <stdio.h>\n\nint main() {\n    // Your code here\n\n    return 0;\n}',
    cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    // Your code here\n\n    return 0;\n}',
    java: '\npublic class Main {\n    public static void main(String[] args) {\n        // Your code here\n\n    }\n}'
  };
  
  editor.setValue(templates[e.target.value] || '', -1);
});

function getCode() { 
  return editor.getValue(); 
}

// Console state
let consoleState = {
  code: '',
  language: '',
  allInputs: '',
  isWaitingForInput: false,
  isFinished: false,
  needsInput: false,
  inputCount: 0
};

// Input detection helper
const InputDetector = {
  needsInput(code, language) {
    switch(language) {
      case 'python':
        return /input\s*\(/.test(code);
      case 'c':
        return /scanf\s*\(/.test(code);
      case 'cpp':
        return /cin\s*>>/.test(code);
      case 'java':
        return /Scanner/.test(code) && /\.next(Int|Line|Double|Float|Boolean|Long)\s*\(/.test(code);
      default:
        return false;
    }
  },
  
  countInputs(code, language) {
    let count = 0;
    switch(language) {
      case 'python':
        const pythonMatches = code.match(/input\s*\(/g);
        count = pythonMatches ? pythonMatches.length : 0;
        break;
      case 'c':
        const cMatches = code.match(/scanf/g);
        count = cMatches ? cMatches.length : 0;
        break;
      case 'cpp':
        const lines = code.split('\n');
        for (let line of lines) {
          if (line.includes('cin') && line.includes('>>')) {
            const matches = line.match(/>>/g);
            count += matches ? matches.length : 0;
          }
        }
        break;
      case 'java':
        const javaMatches = code.match(/\.next(Int|Line|Double|Float|Boolean|Long)\s*\(/g);
        count = javaMatches ? javaMatches.length : 0;
        break;
    }
    return count;
  }
};

// Append text to console output
function appendToConsole(text, className = '') {
  const consoleOutput = document.getElementById('consoleOutput');
  
  const span = document.createElement('span');
  if (className) {
    span.className = className;
  }
  span.textContent = text;
  consoleOutput.appendChild(span);
  
  consoleOutput.scrollTop = consoleOutput.scrollHeight;
}

// Clear console
function clearConsole() {
  document.getElementById('consoleOutput').textContent = '';
}

// Handle Enter key submission
document.getElementById('consoleInput').addEventListener('keydown', function(e) {
  if (!consoleState.isFinished && consoleState.isWaitingForInput) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitInput();
    }
  }
});

// Submit input
function submitInput() {
  if (consoleState.isFinished || !consoleState.isWaitingForInput) {
    return;
  }
  
  const input = document.getElementById('consoleInput');
  const inputText = input.value.trim();
  
  if (!inputText) {
    return;
  }
  
  // Parse input values (space-separated or newline-separated)
  let values = [];
  if (inputText.includes('\n')) {
    values = inputText.split('\n').map(v => v.trim()).filter(v => v);
  } else {
    values = inputText.split(/\s+/).filter(v => v);
  }
  
  // Display user input in console
  appendToConsole(inputText + '\n');
  
  consoleState.allInputs = values.join('\n');
  
  // Clear and disable input
  input.value = '';
  input.disabled = true;
  document.getElementById('submitInputBtn').disabled = true;
  consoleState.isWaitingForInput = false;
  
  setTimeout(() => {
    executeCode();
  }, 100);
}

// Execute code via backend
async function executeCode() {
  try {
    const response = await fetch("/run-test-code/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCookie("csrftoken")
      },
      body: JSON.stringify({
        code: consoleState.code,
        language: consoleState.language,
        stdin: consoleState.allInputs
      })
    });
    
    const data = await response.json();
    
    if (data.success) {
      const output = data.output || '';
      const stderr = data.stderr || '';
      const compileError = data.compile_error || '';
      
      // Check for compile error
      if (compileError) {
        appendToConsole('\n' + compileError, 'error');
        finishExecution();
        return;
      }
      
      // Check for runtime error
      if (stderr) {
        appendToConsole('\n' + stderr, 'error');
        finishExecution();
        return;
      }
      
      // Display output (formatted by backend)
      if (output) {
        appendToConsole('\n' + output);
      } else {
        appendToConsole('\n(No output)', 'info');
      }
      
      finishExecution();
      
    } else {
      appendToConsole('\nError: ' + (data.error || 'Unknown error'), 'error');
      finishExecution();
    }
    
  } catch (error) {
    appendToConsole('\nConnection error: ' + error.message, 'error');
    finishExecution();
  }
}

// Finish execution
function finishExecution() {
  consoleState.isFinished = true;
  consoleState.isWaitingForInput = false;
  document.getElementById('consoleInput').disabled = true;
  document.getElementById('submitInputBtn').disabled = true;
  document.getElementById('rerunBtn').disabled = false;
}

// Rerun code function
function rerunCode() {
  const code = getCode();
  const language = document.getElementById('language').value;
  
  if (!code.trim()) {
    alert('⚠️ Code cannot be empty!');
    return;
  }
  
  const needsInput = InputDetector.needsInput(code, language);
  const inputCount = InputDetector.countInputs(code, language);
  
  consoleState = {
    code: code,
    language: language,
    allInputs: '',
    isWaitingForInput: needsInput,
    isFinished: false,
    needsInput: needsInput,
    inputCount: inputCount
  };
  
  document.getElementById('rerunBtn').disabled = true;
  clearConsole();
  
  if (needsInput) {
    const input = document.getElementById('consoleInput');
    const submitBtn = document.getElementById('submitInputBtn');
    input.disabled = false;
    input.value = '';
    submitBtn.disabled = false;
    
    appendToConsole(`Enter ${inputCount} value(s) (space-separated or press Enter after each):\n`, 'info');
    
    input.focus();
  } else {
    const input = document.getElementById('consoleInput');
    const submitBtn = document.getElementById('submitInputBtn');
    input.disabled = true;
    submitBtn.disabled = true;
    
    setTimeout(() => {
      executeCode();
    }, 100);
  }
}

// Main run function
function runCode() {
  const code = getCode();
  const language = document.getElementById('language').value;
  
  if (!code.trim()) {
    alert('⚠️ Code cannot be empty!');
    return;
  }
  
  const needsInput = InputDetector.needsInput(code, language);
  const inputCount = InputDetector.countInputs(code, language);
  
  consoleState = {
    code: code,
    language: language,
    allInputs: '',
    isWaitingForInput: needsInput,
    isFinished: false,
    needsInput: needsInput,
    inputCount: inputCount
  };
  
  const modal = new bootstrap.Modal(document.getElementById('consoleModal'));
  modal.show();
  
  document.getElementById('rerunBtn').disabled = true;
  clearConsole();
  
  if (needsInput) {
    const input = document.getElementById('consoleInput');
    const submitBtn = document.getElementById('submitInputBtn');
    input.disabled = false;
    input.value = '';
    submitBtn.disabled = false;
    
    appendToConsole(`Enter ${inputCount} value(s) (space-separated or press Enter after each):\n`, 'info');
    
    input.focus();
  } else {
    const input = document.getElementById('consoleInput');
    const submitBtn = document.getElementById('submitInputBtn');
    input.disabled = true;
    submitBtn.disabled = true;
    
    setTimeout(() => {
      executeCode();
    }, 100);
  }
}

// Close console
function closeConsole() {
  const modal = bootstrap.Modal.getInstance(document.getElementById('consoleModal'));
  if (modal) {
    modal.hide();
  }
}

// Auto-focus when modal opens
document.getElementById('consoleModal').addEventListener('shown.bs.modal', function() {
  if (consoleState.needsInput && !consoleState.isFinished) {
    setTimeout(() => {
      document.getElementById('consoleInput').focus();
    }, 300);
  }
});

// CSRF token helper
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>
